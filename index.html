<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthFolio V2 | INR Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'] },
                    colors: { wealth: "#10b981", darkBg: "#0f172a", cardDark: "#1e293b", accent: "#8b5cf6", gig: "#f59e0b" }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Calendar Grid */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.8rem; position: relative; cursor: pointer; transition: all 0.2s; }
        .cal-day:hover { background-color: #10b981; color: white; }
        .cal-day.has-data::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; background: #f59e0b; border-radius: 50%; }
        
        #lock-screen { position: fixed; inset: 0; z-index: 100; background-color: #0f172a; display: flex; align-items: center; justify-content: center; transition: transform 0.5s ease-in-out; }
        #lock-screen.unlocked { transform: translateY(-100%); }
    </style>
</head>
<body class="bg-gray-50 text-slate-800 dark:bg-darkBg dark:text-slate-200 h-screen flex flex-col overflow-hidden">

    <div id="lock-screen">
        <div class="text-center space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-wealth/20 text-wealth mb-4"><i data-lucide="lock" size="40"></i></div>
            <h1 class="text-3xl font-bold text-white tracking-widest font-mono">WEALTHFOLIO</h1>
            <div class="flex gap-2 justify-center mt-4">
                <input type="password" id="pin-input" maxlength="4" placeholder="PIN" class="bg-slate-800 border border-slate-700 text-center text-white text-2xl w-32 py-2 rounded focus:outline-none focus:border-wealth tracking-[0.5em] font-mono transition-all">
                <button onclick="attemptLogin()" class="bg-wealth hover:bg-emerald-600 text-white p-3 rounded"><i data-lucide="arrow-right"></i></button>
            </div>
            <p id="login-msg" class="text-red-500 text-xs h-4"></p>
            <p class="text-xs text-slate-600 mt-8">Default: 0000</p>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative z-0">
        
        <nav class="w-16 md:w-64 bg-white dark:bg-cardDark border-r border-gray-200 dark:border-slate-700 flex flex-col justify-between z-20 shadow-lg shrink-0">
            <div>
                <div class="h-16 flex items-center justify-center md:justify-start md:px-6 border-b border-gray-100 dark:border-slate-700">
                    <i data-lucide="indian-rupee" class="text-wealth shrink-0" size="24"></i>
                    <span class="hidden md:block ml-3 font-bold text-lg tracking-tight">WealthFolio</span>
                </div>
                <div class="flex flex-col gap-1 p-2 mt-2">
                    <button onclick="renderTab('dashboard')" id="nav-dashboard" class="nav-btn active flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="layout-dashboard" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">Dashboard</span></button>
                    <button onclick="renderTab('cashflow')" id="nav-cashflow" class="nav-btn flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="wallet" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">In/Out</span></button>
                    <button onclick="renderTab('gigs')" id="nav-gigs" class="nav-btn flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="briefcase" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">Gigs</span></button>
                    <button onclick="renderTab('goals')" id="nav-goals" class="nav-btn flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="target" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">Goals</span></button>
                    <button onclick="renderTab('converter')" id="nav-converter" class="nav-btn flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="globe" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">Converter</span></button>
                    <button onclick="renderTab('calendar')" id="nav-calendar" class="nav-btn flex items-center p-3 rounded-lg text-slate-500 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all"><i data-lucide="calendar" size="20"></i><span class="hidden md:block ml-3 font-medium text-sm">Calendar</span></button>
                </div>
            </div>
            <div class="p-4 border-t border-gray-100 dark:border-slate-700">
                <button onclick="toggleTheme()" class="flex items-center justify-center md:justify-start w-full p-2 text-slate-400 hover:text-wealth transition-colors">
                    <i id="theme-icon" data-lucide="moon" size="20"></i>
                </button>
            </div>
        </nav>

        <main class="flex-1 overflow-y-auto bg-gray-50 dark:bg-[#0f172a] relative">
            <header class="sticky top-0 z-10 glass-panel px-6 py-4 flex justify-between items-center shadow-sm">
                <h2 id="page-title" class="text-xl font-bold font-mono text-slate-700 dark:text-slate-200">OVERVIEW</h2>
                <div id="header-networth" class="text-wealth font-mono font-bold text-lg">₹0.00</div>
            </header>
            <div id="app-container" class="p-4 md:p-8 max-w-6xl mx-auto pb-32"></div>
        </main>
    </div>

    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 fade-in">
        <div class="bg-white dark:bg-cardDark w-full max-w-md rounded-xl shadow-2xl border border-gray-200 dark:border-slate-700 overflow-hidden">
            <div class="p-5">
                <h3 id="modal-title" class="text-lg font-bold mb-4 text-slate-800 dark:text-white">Action</h3>
                <div id="modal-content" class="space-y-4"></div>
            </div>
            <div class="bg-gray-50 dark:bg-slate-900/50 p-4 flex justify-end gap-3 border-t border-gray-100 dark:border-slate-700">
                <button onclick="closeModal()" class="px-4 py-2 text-sm text-slate-500">Cancel</button>
                <button id="modal-action-btn" class="px-6 py-2 text-sm font-bold bg-wealth text-white rounded shadow-lg">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- STATE & SETUP ---
        let state = { transactions: [], investments: [], goals: [], gigs: [], settings: { theme: 'dark' } };
        const ACCOUNTS = ['SBI', 'Union', 'HDFC', 'PayPal', 'Cash', 'Upwork', 'Other'];
        const CURRENCIES = ['INR', 'USD', 'EUR', 'GBP'];
        let cachedRates = { INR: 1 }; // Default fallback

        window.onload = () => {
            if(localStorage.getItem('wf_data')) state = JSON.parse(localStorage.getItem('wf_data'));
            if(state.settings.theme === 'dark') document.documentElement.classList.add('dark');
            lucide.createIcons();
            document.getElementById('pin-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') attemptLogin(); });
            // Fetch rates silently
            fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r=>r.json()).then(d=>{cachedRates=d.rates;});
        };

        function attemptLogin() {
            if(document.getElementById('pin-input').value === "0000") {
                document.getElementById('lock-screen').classList.add('unlocked');
                setTimeout(() => renderTab('dashboard'), 500);
            } else document.getElementById('login-msg').innerText = "Wrong PIN";
        }
        
        function saveData() { localStorage.setItem('wf_data', JSON.stringify(state)); updateHeader(); refreshCurrentTab(); }
        function updateHeader() { document.getElementById('header-networth').innerText = formatMoney(calculateNetWorth()); }
        function formatMoney(n) { return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2 }); }
        
        function renderTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'bg-slate-100', 'dark:bg-slate-700', 'text-wealth'));
            document.getElementById(`nav-${tab}`).classList.add('active', 'bg-slate-100', 'dark:bg-slate-700', 'text-wealth');
            const c = document.getElementById('app-container');
            const t = document.getElementById('page-title');
            c.innerHTML = ''; t.innerText = tab.toUpperCase();
            
            if(tab==='dashboard') renderDashboard(c);
            if(tab==='cashflow') renderCashFlow(c);
            if(tab==='gigs') renderGigs(c);
            if(tab==='goals') renderGoals(c);
            if(tab==='converter') renderConverter(c);
            if(tab==='calendar') renderCalendar(c);
            lucide.createIcons();
        }
        function refreshCurrentTab() { const a = document.querySelector('.nav-btn.active')?.id.replace('nav-', ''); if(a) renderTab(a); }

        // --- DASHBOARD ---
        function renderDashboard(c) {
            const nw = calculateNetWorth();
            const inc = state.transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
            const exp = state.transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
            c.innerHTML = `
                <div class="fade-in grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="glass-panel p-6 rounded-2xl shadow-sm border-l-4 border-wealth bg-white dark:bg-cardDark">
                        <div class="text-xs font-bold text-slate-400 uppercase">Net Worth</div>
                        <div class="text-3xl font-mono font-bold text-slate-800 dark:text-white">${formatMoney(nw)}</div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl shadow-sm border-l-4 border-red-500 bg-white dark:bg-cardDark">
                        <div class="text-xs font-bold text-slate-400 uppercase">Total Burn</div>
                        <div class="text-3xl font-mono font-bold text-slate-800 dark:text-white">${formatMoney(exp)}</div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl shadow-sm border-l-4 border-gig bg-white dark:bg-cardDark">
                        <div class="text-xs font-bold text-slate-400 uppercase">Active Gigs</div>
                        <div class="text-3xl font-mono font-bold text-slate-800 dark:text-white">${state.gigs.filter(g=>g.status==='active').length}</div>
                    </div>
                </div>
                <div class="bg-white dark:bg-cardDark p-6 rounded-2xl shadow-sm"><canvas id="dashChart" height="100"></canvas></div>
            `;
            setTimeout(()=>{
                new Chart(document.getElementById('dashChart'), {
                    type: 'bar',
                    data: { labels: ['Income', 'Expense', 'Saved'], datasets: [{ label: 'Overview', data: [inc, exp, nw], backgroundColor: ['#10b981','#ef4444','#8b5cf6'] }] },
                    options: { responsive:true, plugins: { legend: { display: false } } }
                });
            }, 100);
        }

        // --- CASH FLOW (With Smart Income) ---
        function renderCashFlow(c) {
            c.innerHTML = `
                <div class="fade-in space-y-4">
                    <div class="flex justify-end gap-2">
                        <button onclick="openIncomeModal()" class="bg-wealth hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow flex gap-2"><i data-lucide="plus-circle" size="16"></i> Income</button>
                        <button onclick="openExpenseModal()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-sm shadow flex gap-2"><i data-lucide="minus-circle" size="16"></i> Expense</button>
                    </div>
                    <div class="bg-white dark:bg-cardDark rounded-xl shadow overflow-hidden border border-gray-200 dark:border-slate-700">
                        ${state.transactions.length===0 ? '<div class="p-8 text-center opacity-50">Nothing yet.</div>' : state.transactions.map((t,i)=>`
                            <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800/50">
                                <div>
                                    <div class="font-bold text-slate-800 dark:text-slate-200">${t.title} <span class="text-xs font-normal text-slate-400">(${t.acc})</span></div>
                                    <div class="text-xs text-slate-400">${t.date} • ${t.category}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-mono font-bold ${t.type==='income'?'text-wealth':'text-red-500'}">${t.type==='income'?'+':'-'}${formatMoney(t.amount)}</div>
                                    ${t.originalCurrency && t.originalCurrency!=='INR' ? `<div class="text-[10px] text-slate-500">from ${t.originalAmt} ${t.originalCurrency}</div>` : ''}
                                </div>
                                <button onclick="deleteTx(${i})" class="ml-4 text-slate-300 hover:text-red-500"><i data-lucide="trash-2" size="14"></i></button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- GIGS TRACKER ---
        function renderGigs(c) {
            if(!state.gigs) state.gigs = [];
            c.innerHTML = `
                <div class="fade-in">
                    <button onclick="addGig()" class="w-full py-3 mb-6 border-2 border-dashed border-gray-300 dark:border-slate-600 text-slate-500 rounded-xl hover:bg-gray-50 dark:hover:bg-slate-800 font-bold">+ NEW FREELANCE GIG</button>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${['active', 'paused', 'dropped'].map(status => `
                            <div class="space-y-4">
                                <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500 border-b pb-2 ${status==='active'?'border-green-500':status==='paused'?'border-yellow-500':'border-red-500'}">${status}</h3>
                                ${state.gigs.filter(g => g.status === status).map(g => `
                                    <div class="bg-white dark:bg-cardDark p-4 rounded-xl shadow-sm border border-gray-200 dark:border-slate-700 relative group">
                                        <div class="flex justify-between mb-2">
                                            <h4 class="font-bold text-slate-800 dark:text-white">${g.name}</h4>
                                            <button onclick="editGigStatus('${g.id}')" class="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded opacity-50 hover:opacity-100">Move</button>
                                        </div>
                                        <div class="text-xs text-slate-400 mb-3 line-clamp-2">${g.notes || 'No description.'}</div>
                                        <div class="flex justify-between items-center text-xs font-mono text-slate-500">
                                            <span>EARNED: ${formatMoney(g.earned || 0)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                                ${state.gigs.filter(g => g.status === status).length === 0 ? '<div class="text-xs text-slate-600 italic">Empty</div>' : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        // --- CONVERTER ---
        function renderConverter(c) {
            c.innerHTML = `
                <div class="fade-in max-w-lg mx-auto bg-white dark:bg-cardDark p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-slate-700 mt-10">
                    <h3 class="text-center font-bold text-xl mb-6 text-slate-700 dark:text-slate-200"><i data-lucide="globe" class="inline mr-2"></i>Live Converter</h3>
                    <div class="flex gap-2 mb-4">
                        <input id="conv-amt" type="number" value="1" class="flex-1 bg-gray-50 dark:bg-slate-900 border p-3 rounded text-lg font-mono outline-none" oninput="runConversion()">
                        <select id="conv-from" class="bg-gray-100 dark:bg-slate-800 border p-3 rounded font-bold" onchange="runConversion()">
                            ${Object.keys(cachedRates).length > 1 ? Object.keys(cachedRates).map(k=>`<option value="${k}" ${k==='USD'?'selected':''}>${k}</option>`).join('') : '<option>USD</option>'}
                        </select>
                    </div>
                    <div class="flex justify-center mb-4"><i data-lucide="arrow-down" class="text-slate-400"></i></div>
                    <div class="flex gap-2 mb-6">
                        <div id="conv-result" class="flex-1 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 p-3 rounded text-lg font-mono font-bold text-emerald-600 dark:text-emerald-400 flex items-center">Loading...</div>
                         <select id="conv-to" class="bg-gray-100 dark:bg-slate-800 border p-3 rounded font-bold" onchange="runConversion()">
                            <option value="INR" selected>INR</option>
                            ${Object.keys(cachedRates).map(k=>`<option value="${k}">${k}</option>`).join('')}
                        </select>
                    </div>
                    <div class="text-center text-[10px] text-slate-400">Rates updated dynamically based on open APIs.</div>
                </div>
            `;
            setTimeout(runConversion, 500); // Wait for fetch
        }

        // --- CALENDAR ---
        function renderCalendar(c) {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            
            let gridHtml = '';
            for(let i=0; i<firstDay; i++) gridHtml += `<div></div>`;
            for(let d=1; d<=daysInMonth; d++) {
                const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                const hasData = state.transactions.some(t => t.date === dateStr);
                gridHtml += `<div onclick="alert('Activity on ${dateStr}:\\n' + (state.transactions.filter(t=>t.date==='${dateStr}').map(t=>t.title + ': ' + t.amount).join('\\n') || 'None'))" class="cal-day bg-white dark:bg-cardDark shadow-sm border border-gray-100 dark:border-slate-700 ${hasData?'has-data':''}">${d}</div>`;
            }

            c.innerHTML = `
                <div class="fade-in max-w-lg mx-auto">
                    <div class="text-center mb-6 font-bold text-xl uppercase tracking-widest text-slate-500">${new Date(year, month).toLocaleString('default', { month: 'long' })} ${year}</div>
                    <div class="calendar-grid text-slate-600 dark:text-slate-300 font-mono font-bold">
                        ${['S','M','T','W','T','F','S'].map(d=>`<div class="text-center text-xs py-2 text-wealth">${d}</div>`).join('')}
                        ${gridHtml}
                    </div>
                </div>
            `;
        }
        
        // --- GOALS (Existing Logic) ---
        function renderGoals(c) {
            c.innerHTML = `<div class="fade-in space-y-6"><button onclick="addGoal()" class="bg-wealth text-white px-4 py-2 rounded shadow font-bold text-sm">+ New Goal</button>${state.goals.map((g,i)=>{const pct=Math.min(100, Math.round((g.current/g.target)*100)); return `<div class="bg-white dark:bg-cardDark p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700"> <div class="flex justify-between items-end mb-2"><div><h4 class="font-bold text-lg text-slate-800 dark:text-white">${g.title} <button onclick="state.goals.splice(${i},1);saveData()" class="text-red-400 ml-2">x</button></h4></div> <div class="text-right"><span class="text-2xl font-bold font-mono text-wealth">${pct}%</span></div></div> <div class="w-full bg-gray-200 dark:bg-slate-700 h-3 rounded-full overflow-hidden"><div class="bg-wealth h-full rounded-full" style="width:${pct}%"></div></div> <div class="mt-2 text-xs text-slate-500 flex justify-between"><span>Saved: ${formatMoney(g.current)}</span><span>Target: ${formatMoney(g.target)}</span></div></div>`;}).join('')}</div>`;
        }

        // --- LOGIC FUNCTIONS ---
        async function runConversion() {
            const amt = parseFloat(document.getElementById('conv-amt').value) || 0;
            const from = document.getElementById('conv-from').value;
            const to = document.getElementById('conv-to').value;
            
            let rate = 1;
            // Simple cross rate calculation if USD base is cached
            if(cachedRates[from] && cachedRates[to]) {
                const inUSD = amt / cachedRates[from];
                const final = inUSD * cachedRates[to];
                document.getElementById('conv-result').innerText = `${final.toFixed(2)} ${to}`;
            } else {
                // Fallback fetch if not cached (e.g. newly loaded)
                try {
                    const req = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
                    const data = await req.json();
                    const final = amt * data.rates[to];
                    document.getElementById('conv-result').innerText = `${final.toFixed(2)} ${to}`;
                } catch(e) {
                    document.getElementById('conv-result').innerText = "API Error";
                }
            }
        }

        function calculateNetWorth() {
            const inc = state.transactions.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
            const exp = state.transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
            return inc - exp;
        }

        // --- MODALS ---
        function openIncomeModal() {
            const m = document.getElementById('modal'); m.classList.remove('hidden');
            document.getElementById('modal-title').innerText = "Add Income";
            document.getElementById('modal-content').innerHTML = `
                <input id="in-desc" placeholder="Description (e.g. Freelance Payment)" class="w-full p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none text-slate-800 dark:text-white">
                <div class="flex gap-2">
                    <input id="in-amt" type="number" placeholder="Amount" class="flex-1 p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none font-mono">
                    <select id="in-curr" class="bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none text-xs">
                        ${CURRENCIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
                    </select>
                </div>
                <select id="in-acc" class="w-full mt-2 p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none text-slate-500">
                    <option value="" disabled selected>Select Account</option>
                    ${ACCOUNTS.map(a=>`<option value="${a}">${a}</option>`).join('')}
                </select>
                <div class="mt-4 pt-4 border-t border-dashed border-gray-300 dark:border-slate-700">
                    <label class="flex items-center gap-2 text-sm text-slate-500 mb-2">
                        <input type="checkbox" id="in-save-check" onchange="document.getElementById('save-opts').classList.toggle('hidden')"> Add to Savings Goal?
                    </label>
                    <div id="save-opts" class="hidden pl-4 space-y-2">
                        <select id="in-goal-id" class="w-full p-2 bg-gray-100 dark:bg-slate-800 rounded text-xs">
                            ${state.goals.length?state.goals.map((g,i)=>`<option value="${i}">${g.title}</option>`).join(''):'<option>No Goals Set</option>'}
                        </select>
                        <input id="in-save-amt" type="number" placeholder="Amount to Save (₹)" class="w-full p-2 bg-gray-100 dark:bg-slate-800 rounded text-xs">
                    </div>
                </div>
            `;
            document.getElementById('modal-action-btn').onclick = async () => {
                const desc = document.getElementById('in-desc').value;
                let amt = parseFloat(document.getElementById('in-amt').value);
                const curr = document.getElementById('in-curr').value;
                const acc = document.getElementById('in-acc').value;
                
                // Convert to INR if needed
                let originalAmt = amt;
                if(curr !== 'INR') {
                     // Try to fetch rate, else ask user? For now, use cached or 1
                     let rate = 1;
                     if(cachedRates[curr]) rate = 1 / cachedRates[curr]; // Inverse of USD base... actually let's just do a quick fetch
                     try { const r = await fetch(`https://api.exchangerate-api.com/v4/latest/${curr}`); const d = await r.json(); rate = d.rates['INR']; } catch(e){}
                     amt = Math.round(amt * rate);
                }

                if(desc && amt) {
                    state.transactions.unshift({
                        id: Date.now(), title: desc, amount: amt, type: 'income', category: 'General', 
                        date: new Date().toISOString().split('T')[0], acc: acc, originalAmt: originalAmt, originalCurrency: curr
                    });
                    
                    // Handle Savings Split
                    if(document.getElementById('in-save-check').checked) {
                        const saveAmt = parseFloat(document.getElementById('in-save-amt').value);
                        const goalIdx = document.getElementById('in-goal-id').value;
                        if(saveAmt && state.goals[goalIdx]) {
                            state.goals[goalIdx].current += saveAmt;
                            // Add a transaction for the transfer?
                            state.transactions.unshift({
                                id: Date.now()+1, title: `Transfer to ${state.goals[goalIdx].title}`, amount: saveAmt, 
                                type: 'expense', category: 'Savings', date: new Date().toISOString().split('T')[0], acc: acc
                            });
                        }
                    }
                    saveData(); closeModal();
                }
            };
        }

        function openExpenseModal() {
            const m = document.getElementById('modal'); m.classList.remove('hidden');
            document.getElementById('modal-title').innerText = "Add Expense";
            document.getElementById('modal-content').innerHTML = `
                <input id="ex-desc" placeholder="Description" class="w-full p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none text-slate-800 dark:text-white">
                <input id="ex-amt" type="number" placeholder="Amount (INR)" class="w-full p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none font-mono mt-2">
                <select id="ex-acc" class="w-full mt-2 p-2 bg-transparent border-b border-gray-300 dark:border-slate-600 outline-none text-slate-500">${ACCOUNTS.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>
            `;
            document.getElementById('modal-action-btn').onclick = () => {
                const t = document.getElementById('ex-desc').value, a = parseFloat(document.getElementById('ex-amt').value), acc = document.getElementById('ex-acc').value;
                if(t && a) { state.transactions.unshift({id: Date.now(), title:t, amount:a, type:'expense', category:'General', date: new Date().toISOString().split('T')[0], acc:acc}); saveData(); closeModal(); }
            }
        }

        function addGig() { const n = prompt("Gig Name (e.g. Website Design):"); if(n) { state.gigs.push({id:Date.now(), name:n, status:'active', earned:0, notes:''}); saveData(); } }
        function editGigStatus(id) { const g = state.gigs.find(x=>x.id==id); const n = prompt("Status (active/paused/dropped):", g.status); if(n && ['active','paused','dropped'].includes(n.toLowerCase())) { g.status = n.toLowerCase(); saveData(); } }
        function addGoal() { const n=prompt("Goal Name:"); const t=prompt("Target Amount:"); if(n&&t){ state.goals.push({title:n, target:parseFloat(t), current:0}); saveData(); } }
        function deleteTx(i) { if(confirm("Delete?")) { state.transactions.splice(i,1); saveData(); } }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); state.settings.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; saveData(); }
    </script>
</body>
</html>
